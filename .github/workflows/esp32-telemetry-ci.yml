name: ESP32 telemetry checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/esp32-telemetry-ci.yml"
  push:
    branches:
      - feat/esp32-telemetry-ingestion

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test ESP32 packet ingestion
        working-directory: backend
        env:
          HARDWARE_ENABLED: "false"
        run: python -m pytest -q tests/test_esp32_telemetry_api.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test ESP32 panel and API service
        working-directory: frontend
        run: npm test -- src/components/dashboard/Esp32TelemetryPanel.test.tsx src/services/esp32TelemetryService.test.ts
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
